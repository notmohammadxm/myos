name: Build MyOS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm gcc-multilib binutils xorriso mtools \
            grub-pc-bin grub-common

      - name: Build
        run: make clean all

      - name: Validate Multiboot2 kernel
        run: make verify

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: myos-iso
          path: myos.iso
          if-no-files-found: error
